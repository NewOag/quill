[package]
name = "quill"
version = "0.1.0"
edition = "2024"
description = "Quill — a fast, native database query tool (MySQL/PostgreSQL/Redis) built on gpui"

[dependencies]
gpui = "0.2.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mysql_async = "0.34"
anyhow = "1"
futures = "0.3"
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
tokio-postgres = { version = "0.7", features = ["runtime"] }
redis = { version = "0.25", features = ["tokio-comp"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
